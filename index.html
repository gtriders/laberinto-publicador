<!doctype html>
<html lang="es">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><meta name="theme-color" content="#111827" /><title>Laberinto Publicador</title><link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=20260826" /><link rel="manifest" href="manifest.webmanifest" /><link rel="stylesheet" href="styles.css" /></head>
<body>
<header class="topbar"><div><span class="eyebrow">LABERINTO</span><h1>Publicador</h1><p class="subtitle">Crear, rescatar y programar contenido.</p></div><div class="top-actions"><button id="exportBtn" class="btn secondary">Exportar respaldo</button><label class="btn secondary file-label">Importar respaldo<input id="importBackup" type="file" accept="application/json" hidden></label><button id="newPostBtn" class="btn primary">+ Nueva publicación</button></div></header>
<main class="shell"><section class="stats compact-stats" aria-label="Resumen"><article class="stat-card"><span>Hoy</span><strong id="todayCount">0</strong><small>programadas</small></article><article class="stat-card"><span>Próximas</span><strong id="scheduledCount">0</strong><small>pendientes</small></article><article class="stat-card"><span>Histórico</span><strong id="libraryCount">0</strong><small>contenidos</small></article></section><section class="panel"><div class="panel-heading"><div><span class="eyebrow">BIBLIOTECA HISTÓRICA</span><h2>Contenido histórico</h2></div><label class="btn secondary file-label">Importar CSV<input id="historyImport" type="file" accept=".csv,text/csv" hidden></label></div><div id="libraryList" class="library-list"></div></section></main>
<dialog id="postDialog"><form id="postForm" method="dialog"><input id="postId" type="hidden"><div class="dialog-head"><div><span class="eyebrow">PUBLICACIÓN</span><h2 id="dialogTitle">Nueva publicación</h2></div><button type="button" id="closeDialog" class="icon-btn">×</button></div><div class="form-grid"><label>Marca<select id="postBrand" required></select></label><input id="postStatus" type="hidden" value="scheduled"><label>Fecha<input id="postDate" type="date" required /></label><label>Hora<input id="postTime" type="time" value="13:00" required /></label></div><label>Título<input id="postTitle" type="text" maxlength="120" required /></label><label>Texto<textarea id="postCopy" rows="6"></textarea></label><label>URL de imagen o video<input id="postMedia" type="url" placeholder="https://..." /></label><div class="dialog-actions"><button type="button" id="deletePostBtn" class="btn danger hidden">Cancelar publicación</button><span></span><button type="button" id="cancelBtn" class="btn secondary">Cerrar</button><button type="submit" class="btn primary">Guardar cambios</button></div></form></dialog>
<script src="app.js?v=20260825m"></script><script src="supabase-sync.js?v=20260825"></script><script src="publish-flow-v3.js?v=20260826a"></script><script src="queue-editor.js?v=20260826a"></script><script src="queue-ai-refresh.js?v=20260826a"></script><script src="instagram-setup.js?v=20260825c"></script><script src="instagram-rescue.js?v=20260825e"></script><script src="rescue-stories.js?v=20260827a"></script><script src="settings.js?v=20260825b"></script><script src="brand-manual.js?v=20260826a"></script><script src="central-data.js?v=20260826a"></script><script src="planner.js?v=20260825a"></script><script src="planner-time-recommendations.js?v=20260830b"></script><script src="ai-studio.js?v=20260826c"></script><script src="image-upload-normalizer.js?v=20260827a"></script><script src="studio-publisher-bridge.js?v=20260826a"></script>
<script>
(() => { const API='https://ufsxdlmnjuaymdszyjue.supabase.co/functions/v1/wordpress-api',PIN_KEY='laberinto_session_pin'; const call=async(body)=>{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,pin:sessionStorage.getItem(PIN_KEY)||''})});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||'Error de conexión');e.detail=d.detail||'';throw e;}return d;}; const status=(text,kind='')=>{const el=document.querySelector('#wpStatus');if(el){el.textContent=text;el.className='settings-status'+(kind?' '+kind:'');}}; async function refresh(){try{const d=await call({action:'status'}),b=document.querySelector('#wpScan');if(d.connected){status(`Conectado a ${d.url} como ${d.display_name||d.user}`,'ok');if(b)b.disabled=false;}else{status(d.error?`No conectado: ${d.error}`:'WordPress pendiente de conexión','warn');if(b)b.disabled=true;}}catch(e){status(e.message,'error');}} function bind(){document.querySelector('#wpConnect')?.addEventListener('click',async()=>{const btn=document.querySelector('#wpConnect'),url=document.querySelector('#wpUrl')?.value.trim()||'',user=document.querySelector('#wpUser')?.value.trim()||'',app_password=document.querySelector('#wpPassword')?.value.trim()||'';if(!url||!user||!app_password){status('Completa URL, usuario y contraseña de aplicación.','warn');return;}btn.disabled=true;status('Probando conexión con WordPress…');try{const d=await call({action:'connect',url,user,app_password});document.querySelector('#wpPassword').value='';status(`Conectado a ${d.url} como ${d.display_name||d.user}`,'ok');document.querySelector('#wpScan').disabled=false;}catch(e){status(e.detail?`${e.message}: ${e.detail}`:e.message,'error');}finally{btn.disabled=false;}});document.querySelector('#wpScan')?.addEventListener('click',async()=>{const btn=document.querySelector('#wpScan'),out=document.querySelector('#wpScanResult');btn.disabled=true;if(out)out.textContent='Analizando páginas, entradas y productos…';try{const d=await call({action:'scan'}),c=d.counts||{};if(out){out.textContent=`Inventario inicial: ${c.page||0} páginas · ${c.post||0} entradas · ${c.product||0} productos.`;out.className='settings-status ok';}}catch(e){if(out){out.textContent=e.message;out.className='settings-status error';}}finally{btn.disabled=false;}});} function mount(){if(document.querySelector('#wpSettingsCard'))return true;const grid=document.querySelector('#settingsView .settings-grid');if(!grid)return false;const card=document.createElement('article');card.id='wpSettingsCard';card.className='settings-card settings-full';card.innerHTML='<span class="eyebrow">WORDPRESS / SEO</span><h3>Conectar adria.cl</h3><p class="helper">Conecta WordPress con una contraseña de aplicación. La credencial queda guardada en el servidor.</p><div class="settings-row"><input id="wpUrl" type="url" value="https://adria.cl" placeholder="https://adria.cl"><input id="wpUser" type="text" value="adriad" placeholder="Usuario WordPress"><input id="wpPassword" type="password" placeholder="Contraseña de aplicación"><button id="wpConnect" class="btn primary" type="button">Conectar WordPress</button></div><div class="settings-row"><span id="wpStatus" class="settings-status">Comprobando conexión…</span><button id="wpScan" class="btn secondary" type="button" disabled>Analizar sitio</button></div><div id="wpScanResult" class="settings-status"></div>';
    const admin=document.querySelector('#settingsAdminActions')?.closest('.settings-card');grid.insertBefore(card,admin||null);bind();refresh();return true;}
  let tries=0;const timer=setInterval(()=>{tries++;if(mount()||tries>80)clearInterval(timer);},250);mount();
})();
</script>
</body></html>
