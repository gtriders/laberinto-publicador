<!doctype html>
<html lang="es">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><meta name="theme-color" content="#111827" /><title>Laberinto Publicador</title><link rel="manifest" href="manifest.webmanifest" /><link rel="stylesheet" href="styles.css" /></head>
<body>
<header class="topbar"><div><span class="eyebrow">LABERINTO</span><h1>Publicador</h1><p class="subtitle">Crear, rescatar y programar contenido.</p></div><div class="top-actions"><button id="exportBtn" class="btn secondary">Exportar respaldo</button><label class="btn secondary file-label">Importar respaldo<input id="importBackup" type="file" accept="application/json" hidden></label><button id="newPostBtn" class="btn primary">+ Nueva publicación</button></div></header>
<main class="shell">
<section class="stats compact-stats" aria-label="Resumen"><article class="stat-card"><span>Hoy</span><strong id="todayCount">0</strong><small>programadas</small></article><article class="stat-card"><span>Próximas</span><strong id="scheduledCount">0</strong><small>pendientes</small></article><article class="stat-card"><span>Histórico</span><strong id="libraryCount">0</strong><small>contenidos</small></article></section>
<section class="panel"><div class="panel-heading"><div><span class="eyebrow">BIBLIOTECA HISTÓRICA</span><h2>Contenido histórico</h2></div><label class="btn secondary file-label">Importar CSV<input id="historyImport" type="file" accept=".csv,text/csv" hidden></label></div><div id="libraryList" class="library-list"></div></section>
</main>
<dialog id="postDialog"><form id="postForm" method="dialog"><input id="postId" type="hidden"><div class="dialog-head"><div><span class="eyebrow">PUBLICACIÓN</span><h2 id="dialogTitle">Nueva publicación</h2></div><button type="button" id="closeDialog" class="icon-btn">×</button></div><div class="form-grid"><label>Marca<select id="postBrand" required></select></label><input id="postStatus" type="hidden" value="scheduled"><label>Fecha<input id="postDate" type="date" required /></label><label>Hora<input id="postTime" type="time" value="13:00" required /></label></div><label>Título<input id="postTitle" type="text" maxlength="120" required /></label><label>Texto<textarea id="postCopy" rows="6"></textarea></label><label>URL de imagen o video<input id="postMedia" type="url" placeholder="https://..." /></label><div class="dialog-actions"><button type="button" id="deletePostBtn" class="btn danger hidden">Cancelar publicación</button><span></span><button type="button" id="cancelBtn" class="btn secondary">Cerrar</button><button type="submit" class="btn primary">Guardar cambios</button></div></form></dialog>
<script src="app.js?v=20260825m"></script><script src="supabase-sync.js?v=20260825"></script><script src="publish-flow-v2.js?v=20260826a"></script><script src="instagram-setup.js?v=20260825c"></script><script src="instagram-rescue.js?v=20260825e"></script><script src="settings.js?v=20260825b"></script><script src="brand-manual.js?v=20260826a"></script><script src="planner.js?v=20260825a"></script>
</body></html>
